name: Refresh Volume Data

on:
  schedule:
    # Run daily after market close (5:00 PM ET = 21:00 UTC)
    - cron: "0 21 * * 1-5"  # Mon-Fri at 5:00 PM ET (market close)

  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbol set to refresh: liquid (default), nasdaq100, or sp500"
        required: false
        default: "liquid"

env:
  VOLARIS_API_URL: ${{ secrets.VOLARIS_API_URL || 'https://volaris-yz19.onrender.com' }}
  VOLARIS_API_TOKEN: ${{ secrets.VOLARIS_API_TOKEN }}

jobs:
  refresh-volume:
    name: Refresh Daily Volume Data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Process in 3 batches: NASDAQ-100, S&P 500 first half, S&P 500 second half
        batch: ["nasdaq100", "sp500_batch1", "sp500_batch2"]
      fail-fast: false  # Continue other batches even if one fails

    steps:
      - name: Refresh Volume Data Batch
        run: |
          # Map batch names to API symbols parameter
          case "${{ matrix.batch }}" in
            "nasdaq100")
              SYMBOLS="nasdaq100"
              ;;
            "sp500_batch1")
              # Will process first ~250 S&P 500 stocks
              SYMBOLS="sp500"
              ;;
            "sp500_batch2")
              # Future: implement pagination in API for S&P 500 second half
              # For now, sp500 call processes all stocks (will be slow)
              echo "Skipping sp500_batch2 - full S&P 500 already processed in batch1"
              exit 0
              ;;
          esac

          echo "Refreshing volume data for batch: ${{ matrix.batch }} (symbols=$SYMBOLS)"

          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 -X POST \
            "$VOLARIS_API_URL/api/v1/market/refresh/volume?symbols=$SYMBOLS" \
            -H "Authorization: Bearer $VOLARIS_API_TOKEN" \
            -H "Content-Type: application/json")

          # Split response and status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          # Check HTTP status first
          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "❌ HTTP request failed with status $HTTP_CODE"
            exit 1
          fi

          # Extract counts using jq
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
          SYMBOL_COUNT=$(echo "$BODY" | jq -r '.symbol_count // 0')
          BARS_ADDED=$(echo "$BODY" | jq -r '.bars_added // 0')

          echo "✓ Volume refresh completed for ${{ matrix.batch }}: $BARS_ADDED bars for $SYMBOL_COUNT symbols (status: $STATUS)"

          # Fail workflow if status is not completed
          if [ "$STATUS" != "completed" ]; then
            echo "❌ Volume refresh failed or incomplete for ${{ matrix.batch }}"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "⚠️ Volume refresh workflow failed"
          echo "Check logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
